stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.default_python: &default_python
  image: python:3.12
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

unit_tests:
  <<: *default_python
  stage: test
  script:
    - pytest -q

container_build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t deribit-client:$CI_COMMIT_SHORT_SHA .
  only:
    - main
    - master
